[project]
name = "bambulab-timelapse-downloader"
version = "0.1.0"
description = "Downloads timelapse videos from Bambu Lab 3D printers via FTP"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "moviepy>=2.2.1",
    "croniter>=6.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # Pinned to what CI lints with, so local ruff cannot disagree with a gate
    # that now fails the build rather than just annotating it.
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The module lives at the repo root rather than under src/, so tests need the
# root on sys.path to import it.
pythonpath = ["."]

[tool.ruff.lint]
# Pinned explicitly rather than inheriting ruff's defaults: that default set has
# already widened once (0.16 went well past E4/E7/E9/F), and CI installs ruff at
# "latest" against a gate that now blocks, so an upstream change would turn into
# a surprise red build.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "DTZ", "PL"]
# BLE001 (blind `except Exception`) is deliberate here. This is a long-running
# daemon and each of those handlers is a resilience boundary: a single bad file,
# a failed conversion or a flaky printer has to be logged and stepped over, not
# allowed to end the run or stop the container. Narrowing them would let an
# unexpected error abort the whole batch.
ignore = ["BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["timelapse_downloader.py"]

name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

jobs:
  ci-cd:
    name: Python CI/CD Pipeline
    uses: mac-lucky/actions-shared-workflows/.github/workflows/python-cicd-reusable.yml@master
    with:
      # Application configuration
      app_name: "bambulab-timelapse-downloader"
      dockerhub_image: "maclucky/bambulab-timelapse-downloader"
      ghcr_image: "ghcr.io/mac-lucky/bambulab-timelapse-downloader"

      # Build configuration
      dockerfile_path: "./Dockerfile"
      build_context: "."

      # Package manager
      use_uv: true

      # Test configuration
      enable_unit_tests: true
      enable_container_tests: true
      enable_kubernetes_tests: false

      # Security and quality
      enable_security_scan: true
      enable_sbom: true
      enable_code_analysis: true

      # Deployment
      push_to_dockerhub: true
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}

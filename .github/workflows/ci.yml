name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  pull_request_target:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The shared workflow only runs container and kubernetes smoke tests, so the
  # unit tests are driven from here.
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exact version: setup-uv stopped publishing floating major tags after v7.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

  ci-cd:
    name: Python CI/CD Pipeline
    uses: mac-lucky/actions-shared-workflows/.github/workflows/python-cicd-reusable.yml@master
    # Add permissions for dependabot PRs
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
      pull-requests: read
    with:
      # Application configuration
      app_name: "bambulab-timelapse-downloader"
      dockerhub_image: "maclucky/bambulab-timelapse-downloader"
      ghcr_image: "ghcr.io/mac-lucky/bambulab-timelapse-downloader"

      # Build configuration
      dockerfile_path: "./dockerfile"
      build_context: "."

      # Package manager
      use_uv: true

      # Test configuration
      enable_container_tests: true
      enable_kubernetes_tests: false

      # Security and quality
      enable_security_scan: true
      enable_sbom: true
      enable_code_analysis: true

      # Deployment
      enable_auto_version: true
      push_on_main: true
      push_to_dockerhub: true
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
